<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shopping Cart</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>jabar shoes Shopping Cart</h1>
    <nav>
        <a href="index.html">Home</a>
        <a href="products.html">Products</a>
    </nav>
</header>

<section style="padding:40px;">
    <h2>Your Cart</h2>

    <div id="cartItems"></div>

    <h3 id="total">Total: ₹0</h3>
    <br>

    <a href="checkout.html" class="btn">Proceed to Checkout</a>
</section>

<script>

let cart = JSON.parse(localStorage.getItem("cart")) || [];

let cartItems = document.getElementById("cartItems");
let total = 0;

if (cart.length === 0) {

    cartItems.innerHTML = "<h3>Your Cart is Empty.</h3>";

} else {

    cart.forEach((item, index) => {

        total += Number(item.price.replace(/[₹,]/g, ""));

        cartItems.innerHTML += `
        <div class="card" style="margin-bottom:20px;">
            <img src="${item.image}" width="150">
            <h3>${item.name}</h3>
            <p>${item.price}</p>

            <button onclick="removeItem(${index})"
            style="background:red;color:white;border:none;padding:10px 20px;border-radius:5px;cursor:pointer;">
                Remove
            </button>

        </div>
        `;
    });

    document.getElementById("total").innerHTML = "Total: ₹" + total;

}

function removeItem(index){

    cart.splice(index,1);

    localStorage.setItem("cart", JSON.stringify(cart));

    location.reload();

}

</script>

</body>
</html>
