<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Us - Shoe Store</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>jabar Shoe Store</h1>
    <nav>
        <a href="index.html">Home</a>
        <a href="products.html">Products</a>
        <a href="cart.html">Cart</a>
        <a href="contact.html">Contact</a>
    </nav>
</header>

<section style="max-width:600px; margin:40px auto; padding:20px;">
    <h2>Contact Us</h2>
    <p>If you have any questions, feel free to contact us.</p>

    <form id="contactForm">

        <input type="text" placeholder="Your Name" required
        style="width:100%; padding:12px; margin:10px 0;">

        <input type="email" placeholder="Your Email" required
        style="width:100%; padding:12px; margin:10px 0;">

        <textarea placeholder="Your Message" required
        style="width:100%; height:120px; padding:12px; margin:10px 0;"></textarea>

        <button type="submit" class="btn">Send Message</button>

    </form>
</section>

<footer>
    <p>© 2026 Shoe Store. All Rights Reserved.</p>
</footer>

<script>
document.getElementById("contactForm").addEventListener("submit", function(e){
    e.preventDefault();
    alert(" Your message has been sent successfully!");
    this.reset();
});
</script>

</body>
</html>
